<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="SiliconLoop">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#f1ede4"/></linearGradient>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#111111" stop-opacity="0"/><stop offset=".5" stop-color="#111111"/><stop offset="1" stop-color="#111111" stop-opacity="0"/></linearGradient>
<clipPath id="k"><rect width="600" height="300" rx="16"/></clipPath></defs>
<style>.serif{font-family:Georgia,'Times New Roman',Times,serif}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.sc{animation:sc 5s ease-in-out infinite}@keyframes sc{0%{transform:translateX(-260px)}100%{transform:translateX(600px)}}
@media (prefers-reduced-motion:reduce){.sc{animation:none}}</style>
<g clip-path="url(#k)">
<rect width="600" height="300" fill="url(#g)"/>
<g><circle cx="570" cy="24" r="1.4" fill="#cfc8b8"/><circle cx="570" cy="42" r="1.4" fill="#cfc8b8"/><circle cx="570" cy="60" r="1.4" fill="#cfc8b8"/><circle cx="570" cy="78" r="1.4" fill="#cfc8b8"/><circle cx="552" cy="24" r="1.4" fill="#cfc8b8"/><circle cx="552" cy="42" r="1.4" fill="#cfc8b8"/><circle cx="552" cy="60" r="1.4" fill="#cfc8b8"/><circle cx="552" cy="78" r="1.4" fill="#cfc8b8"/><circle cx="534" cy="24" r="1.4" fill="#cfc8b8"/><circle cx="534" cy="42" r="1.4" fill="#cfc8b8"/><circle cx="534" cy="60" r="1.4" fill="#cfc8b8"/><circle cx="534" cy="78" r="1.4" fill="#cfc8b8"/><circle cx="516" cy="24" r="1.4" fill="#cfc8b8"/><circle cx="516" cy="42" r="1.4" fill="#cfc8b8"/><circle cx="516" cy="60" r="1.4" fill="#cfc8b8"/><circle cx="516" cy="78" r="1.4" fill="#cfc8b8"/><circle cx="498" cy="24" r="1.4" fill="#cfc8b8"/><circle cx="498" cy="42" r="1.4" fill="#cfc8b8"/><circle cx="498" cy="60" r="1.4" fill="#cfc8b8"/><circle cx="498" cy="78" r="1.4" fill="#cfc8b8"/><circle cx="480" cy="24" r="1.4" fill="#cfc8b8"/><circle cx="480" cy="42" r="1.4" fill="#cfc8b8"/><circle cx="480" cy="60" r="1.4" fill="#cfc8b8"/><circle cx="480" cy="78" r="1.4" fill="#cfc8b8"/></g>
<rect class="sc" x="0" y="0" width="260" height="2.5" fill="url(#scan)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="298.5" rx="15.5" fill="none" stroke="#d9d3c5" stroke-width="1.5"/>
<text x="28" y="44" class="serif" font-size="13" letter-spacing="2.5" fill="#111111">VISION · FIRMWARE · SIMULATION</text>
<text x="28" y="86" class="sans" font-size="32" font-weight="800" fill="#111111" letter-spacing="-.5">SiliconLoop</text>
<text x="28" y="120" class="serif" font-size="18" fill="#55524b">Photo of parts + one sentence → circuit, firmware</text><text x="28" y="145" class="serif" font-size="18" fill="#55524b">and a simulated twin that passes every behaviour.</text>
<text x="28" y="208" class="serif" font-size="32" font-weight="700" fill="#111111">22/22<tspan dx="14" font-size="16" font-weight="400" font-style="italic" fill="#55524b">verified builds vs 27% for the raw model</tspan></text>
<rect x="28" y="248" width="65" height="28" rx="14" fill="#ffffff" stroke="#111111"/><text x="60.5" y="267" text-anchor="middle" class="serif" font-size="14" fill="#111111">Vision</text><rect x="101" y="248" width="72" height="28" rx="14" fill="#ffffff" stroke="#111111"/><text x="137" y="267" text-anchor="middle" class="serif" font-size="14" fill="#111111">Arduino</text><rect x="181" y="248" width="93" height="28" rx="14" fill="#ffffff" stroke="#111111"/><text x="227.5" y="267" text-anchor="middle" class="serif" font-size="14" fill="#111111">Simulation</text><rect x="282" y="248" width="72" height="28" rx="14" fill="#ffffff" stroke="#111111"/><text x="318" y="267" text-anchor="middle" class="serif" font-size="14" fill="#111111">Baseten</text><rect x="362" y="248" width="86" height="28" rx="14" fill="#ffffff" stroke="#111111"/><text x="405" y="267" text-anchor="middle" class="serif" font-size="14" fill="#111111">Cloud Run</text>
</svg>